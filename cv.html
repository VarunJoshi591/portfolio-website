<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Varun Joshi | Curriculum Vitae Viewer</title>
    <meta name="description" content="Official Curriculum Vitae of Varun Joshi - M.Sc. Computer Science Student & Aspiring Full-Stack Developer.">
    <meta name="author" content="Varun Joshi">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

    <!-- FontAwesome Icons CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
        integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
        crossorigin="anonymous" referrerpolicy="no-referrer">

    <!-- Custom Stylesheet -->
    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body class="cv-page-body">

    <!-- Dedicated CV Viewer Header -->
    <header class="cv-header">
        <div class="cv-header-container">
            <!-- Left: Back Navigation -->
            <div class="cv-header-left">
                <a href="index.html" class="btn btn-secondary btn-sm cv-back-btn" aria-label="Back to Portfolio">
                    <i class="fa-solid fa-arrow-left"></i> <span>Back to Portfolio</span>
                </a>
            </div>

            <!-- Center: CV Document Title -->
            <div class="cv-header-center">
                <div class="cv-badge-icon">
                    <i class="fa-solid fa-eye"></i>
                </div>
                <div class="cv-header-title-wrapper">
                    <h1 class="cv-header-title">Varun Joshi — <span class="gradient-text">Curriculum Vitae</span></h1>
                </div>
            </div>

            <!-- Right: Viewer Controls & Actions -->
            <div class="cv-header-right">
                <!-- Viewer Control Toolbar -->
                <div class="cv-toolbar-controls">
                    <button id="zoomOutBtn" class="cv-tool-btn" title="Zoom Out" aria-label="Zoom Out">
                        <i class="fa-solid fa-magnifying-glass-minus"></i>
                    </button>
                    <span id="zoomLevelDisplay" class="cv-zoom-label">100%</span>
                    <button id="zoomInBtn" class="cv-tool-btn" title="Zoom In" aria-label="Zoom In">
                        <i class="fa-solid fa-magnifying-glass-plus"></i>
                    </button>
                    <button id="zoomResetBtn" class="cv-tool-btn" title="Reset Zoom" aria-label="Reset Zoom">
                        <i class="fa-solid fa-rotate-left"></i>
                    </button>
                    <button id="fullscreenBtn" class="cv-tool-btn" title="Toggle Fullscreen" aria-label="Toggle Fullscreen">
                        <i class="fa-solid fa-expand"></i>
                    </button>
                </div>

                <div class="cv-header-divider"></div>

                <!-- Action Buttons -->
                <div class="cv-action-buttons">
                    <a href="assets/resume/Varun_Joshi_Resume.pdf" target="_blank" rel="noopener noreferrer" class="btn btn-secondary btn-sm cv-btn-raw" aria-label="Open PDF in new tab">
                        <i class="fa-solid fa-up-right-from-square"></i> <span class="btn-text">Open Raw PDF</span>
                    </a>
                    <a href="assets/resume/Varun_Joshi_Resume.pdf" download="Varun_Joshi_Resume.pdf" class="btn btn-primary btn-sm cv-btn-download" aria-label="Download CV PDF">
                        <i class="fa-solid fa-download"></i> <span>Download CV</span>
                    </a>
                </div>
            </div>
        </div>
    </header>

    <!-- Main CV Viewing Wrapper -->
    <main class="cv-main-wrapper" id="cvMainWrapper">
        <div class="cv-viewer-viewport">
            <div class="cv-scale-container" id="cvScaleContainer">
                <iframe 
                    id="cvPdfFrame"
                    src="assets/resume/Varun_Joshi_Resume.pdf#toolbar=1&navpanes=0&view=FitH" 
                    class="cv-pdf-iframe" 
                    title="Varun Joshi Curriculum Vitae PDF"
                    loading="eager">
                </iframe>
            </div>

            <!-- Fallback UI if Browser PDF Engine Fails -->
            <div id="cvFallbackContainer" class="cv-fallback-wrapper">
                <div class="cv-fallback-card glass-card">
                    <div class="cv-fallback-icon">
                        <i class="fa-solid fa-file-pdf"></i>
                    </div>
                    <h2>Curriculum Vitae</h2>
                    <p>Your browser doesn't support inline PDF preview. You can easily view or download the complete CV file below:</p>
                    <div class="cv-fallback-actions">
                        <a href="assets/resume/Varun_Joshi_Resume.pdf" download="Varun_Joshi_Resume.pdf" class="btn btn-primary">
                            <i class="fa-solid fa-download"></i> Download CV (PDF)
                        </a>
                        <a href="assets/resume/Varun_Joshi_Resume.pdf" target="_blank" rel="noopener noreferrer" class="btn btn-secondary">
                            <i class="fa-solid fa-up-right-from-square"></i> Open Raw PDF
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Dedicated Viewer Script -->
    <script src="assets/js/cv-viewer.js"></script>
</body>

</html>
